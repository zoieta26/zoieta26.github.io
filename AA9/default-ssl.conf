<VirtualHost *:80>
    ServerName ine5646.lucas.feitor.vms.ufsc.br
    DocumentRoot /var/www/html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{REQUEST_URI} !^/zoieta26\.github\.io(?:/|$)
    RewriteRule ^ https://ine5646.lucas.feitor.vms.ufsc.br%{REQUEST_URI} [R=302,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/vagalink/http-error.log
    CustomLog ${APACHE_LOG_DIR}/vagalink/http-access.log combined
</VirtualHost>
<VirtualHost *:443>
    ServerName ine5646.lucas.feitor.vms.ufsc.br
    DocumentRoot /var/www/html
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/apache2/ssl/vagalink/server.crt
    SSLCertificateKeyFile /etc/apache2/ssl/vagalink/server.key
    # A confianca deve ser configurada nos clientes da VPN. Nao aplicar HSTS
    # enquanto a distribuicao do certificado de laboratorio nao for concluida.
    Header always unset Strict-Transport-Security
    Header onsuccess unset Strict-Transport-Security
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass "/zoieta26.github.io" "!"
# AA9: TLS validado também no backend local.
SSLProxyEngine On
SSLProxyVerify require
SSLProxyCheckPeerName On
SSLProxyCACertificateFile /etc/aa9/proxy.crt
ProxyPass "/AA/AA9/ws" "wss://localhost:8082/AA/AA9/ws" timeout=3600
ProxyPassReverse "/AA/AA9/ws" "wss://localhost:8082/AA/AA9/ws"

<Location "/AA/AA9/ws">
    ProxyPreserveHost Off
</Location>

    ProxyPass "/AA" "!"
    ProxyPass "/.well-known/acme-challenge/" "!"
    ProxyPass "/ws" "http://127.0.0.1:3000/ws" upgrade=websocket timeout=3600
    ProxyPass "/" "http://127.0.0.1:3000/" connectiontimeout=5 timeout=60
    ProxyPassReverse "/" "http://127.0.0.1:3000/"
    # Mantem os arquivos da AA9 como texto, sem executar Python pelo Apache.
    <Directory /var/www/html/AA/AA9>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        AddType text/plain .py .conf .md .service .sh .txt
        RemoveHandler .py
        <FilesMatch "\.py$">
            SetHandler default-handler
            ForceType text/plain
        </FilesMatch>
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/vagalink/ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/vagalink/ssl-access.log combined
</VirtualHost>
